{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Applicants</title>
    <link rel="stylesheet" href="{% static 'css/applicant.css' %}">
</head>
<body>
    <h2>Submit New Applicant</h2>

    <!-- ✅ Form to add new applicant -->
    <form method="post" action="{% url 'submit_applicant' %}">
        {% csrf_token %}
        <label>Name:</label>
        <input type="text" name="name" required><br><br>

        <label>Email:</label>
        <input type="email" name="email" required><br><br>

        <label>Phone:</label>
        <input type="text" name="phone" required><br><br>

        <button type="submit">Submit Applicant</button>
    </form>

    <hr>

    <h2>Applicant List</h2>

    <!-- Export to Excel Button -->
    <form method="get" action="{% url 'export_excel' %}">
        <button type="submit">Export to Excel</button>
    </form>

    <!-- Applicant Table -->
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Applied On</th>
            </tr>
        </thead>
        <tbody>
            {% for applicant in applicants %}
            <tr>
                <td>{{ applicant.name }}</td>
                <td>{{ applicant.email }}</td>
                <td>{{ applicant.phone }}</td>
                <td>{{ applicant.applied_on }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="4">No applicants yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
